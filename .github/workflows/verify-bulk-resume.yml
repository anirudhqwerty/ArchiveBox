name: Verify bulk crawl resume

on:
  push:
    branches: [verify/bulk-resume-ci]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_SOURCES: '1'
      USE_COLOR: 'False'
      DATA_DIR: ${{ runner.temp }}/archivebox-data
      ABXPKG_LIB_DIR: ${{ runner.temp }}/archivebox-lib
      PERSONAS_DIR: ${{ runner.temp }}/archivebox-personas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.3'
      - run: uv sync --locked --dev --extra sonic --extra debug
      - name: Run real admin regression
        run: |
          mkdir -p "$DATA_DIR" "$PERSONAS_DIR"
          uv run --no-sync --no-sources pytest archivebox/tests/test_ui_admin_crawl_resume.py -x -v --junitxml="$RUNNER_TEMP/results.xml"
      - name: Save regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bulk-resume-results
          path: ${{ runner.temp }}/results.xml
          if-no-files-found: ignore
