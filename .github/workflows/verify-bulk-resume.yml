name: Verify bulk crawl resume

on:
  push:
    branches: [verify/bulk-resume-resolution]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_SOURCES: '1'
      USE_COLOR: 'False'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a26ea992ffd20ff8c82c5941dbd3d2923598d403
      - name: Isolate runtime paths
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/archivebox-data" >> "$GITHUB_ENV"
          echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/archivebox-lib" >> "$GITHUB_ENV"
          echo "PERSONAS_DIR=$RUNNER_TEMP/archivebox-personas" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.3'
      - run: uv sync --locked --dev --extra sonic --extra debug
      - name: Run real admin regression and related admin tests
        run: |
          mkdir -p "$DATA_DIR" "$PERSONAS_DIR"
          uv run --no-sync --no-sources pytest -x -v --junitxml="$RUNNER_TEMP/results.xml" \
            archivebox/tests/test_ui_admin_crawl_resume.py \
            archivebox/tests/test_ui_admin_crawl.py \
            archivebox/tests/test_crawl_pause.py \
            archivebox/tests/test_crawl_runner.py::test_snapshot_queue_selection_is_retry_at_only_for_sealed_maintenance \
            archivebox/tests/test_crawl_runner.py::test_crawl_start_event_does_not_reschedule_sealed_parent_until_explicit_requeue \
            archivebox/tests/test_crawl_runner.py::test_crawl_completed_event_requeues_active_snapshots
      - name: Repository lint and formatting
        if: always()
        run: |
          uv run --no-sync --no-sources prek run --all-files
      - name: Save formatting corrections for local application
        if: failure()
        run: git diff > "$RUNNER_TEMP/formatting.patch"
      - name: Save regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bulk-resume-results
          path: |
            ${{ runner.temp }}/results.xml
            ${{ runner.temp }}/formatting.patch
          if-no-files-found: ignore
