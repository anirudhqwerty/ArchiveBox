name: Verify maintainer crawl resume changes

on:
  push:
    branches: [verify/pirate-resume-c873746]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_NO_SOURCES: '1'
      USE_COLOR: 'False'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c873746f48587102bc720db97218ca440e73323f
      - name: Record exact source and isolate runtime paths
        run: |
          git rev-parse HEAD
          echo "DATA_DIR=$RUNNER_TEMP/archivebox-data" >> "$GITHUB_ENV"
          echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/archivebox-lib" >> "$GITHUB_ENV"
          echo "PERSONAS_DIR=$RUNNER_TEMP/archivebox-personas" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --locked --dev
      - name: Verify admin scheduling, API restart, real interrupted captures and paused UI
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR" "$PERSONAS_DIR" "$RUNNER_TEMP/evidence"
          uv run --no-sync --no-sources pytest -v --durations=15 --junitxml="$RUNNER_TEMP/evidence/results.xml" \
            archivebox/tests/test_ui_admin_crawl_resume.py \
            archivebox/tests/test_ui_admin_crawl.py \
            archivebox/tests/test_crawl_pause.py \
            archivebox/tests/test_api_v1_crawls_crawl_crawl_id.py \
            archivebox/tests/test_ui_public_snapshot.py::test_paused_snapshot_explains_restart_after_an_earlier_attempt \
            2>&1 | tee "$RUNNER_TEMP/evidence/pytest.log"
      - name: Repository lint and formatting
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          uv run --no-sync --no-sources prek run --all-files 2>&1 | tee "$RUNNER_TEMP/evidence/prek.log"
      - name: Preserve check output and any formatter changes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git diff > "$RUNNER_TEMP/evidence/check-changes.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintainer-resume-verification
          path: ${{ runner.temp }}/evidence
