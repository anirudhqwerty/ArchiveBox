name: Compare browser-panel timing
on:
  push:
    branches: [verify/browser-panel-comparison]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: upstream-base
            ref: c55089eaefcacf3439322eec897763f518588f37
          - name: pr-head
            ref: 2d806f79b520e16293f0bcafd72ba8311e79fb27
    name: ${{ matrix.name }}
    env:
      UV_NO_SOURCES: '1'
      USE_COLOR: 'False'
      CHROME_HEADLESS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
      - name: Isolate runtime paths
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/archivebox-data" >> "$GITHUB_ENV"
          echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/archivebox-lib" >> "$GITHUB_ENV"
          echo "PERSONAS_DIR=$RUNNER_TEMP/archivebox-personas" >> "$GITHUB_ENV"
          echo "CHROME_USER_DATA_DIR=$RUNNER_TEMP/archivebox-personas/Default/chrome_profile" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.3'
      - run: uv sync --locked --dev
      - name: Run unchanged browser-panel assertions with four workers
        run: |
          mkdir -p "$DATA_DIR" "$PERSONAS_DIR"
          uv run --no-sync --no-sources pytest -vs -n 4 archivebox/tests/test_opencode_browser_panel.py --basetemp="$RUNNER_TEMP/pytest" --junitxml="$RUNNER_TEMP/results.xml"
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-panel-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/results.xml
            ${{ runner.temp }}/pytest/**/preview-cost.log
